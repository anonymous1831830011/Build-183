<!DOCTYPE html>
<html>
<head>
<title>ACCESS TERMINAL</title>

<style>
body{
background:black;
color:lime;
font-family:monospace;
text-align:center;
margin-top:20%;
transition:0.2s;
}

input{
padding:8px;
background:black;
color:lime;
border:1px solid lime;
}

button{
padding:8px 15px;
background:lime;
border:none;
cursor:pointer;
}

#msg{
margin-top:20px;
color:red;
}
</style>
</head>

<body>

<h2>RESTORE PROTOCOL ACCESS</h2>
<p>ENTER CODE:</p>

<input type="password" id="codeInput">
<button onclick="checkCode()">ENTER</button>

<p id="msg"></p>

<script>

let attempts = 0;

function checkCode(){

let code = document.getElementById("codeInput").value;

if(code === "18364"){
window.location.href = "restore.html";
}
else{
attempts++;
document.getElementById("msg").innerText = "ACCESS DENIED";

glitchEffect();

if(attempts === 2){
document.getElementById("msg").innerText = "UNAUTHORIZED ACCESS DETECTED";
}

if(attempts >= 3){
window.location.href = "error.html";
}
}

}

function glitchEffect(){
document.body.style.background="white";
setTimeout(function(){
document.body.style.background="black";
},150);
}

</script>

</body>
</html>
